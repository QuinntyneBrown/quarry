name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/Quarry.sln
      - run: dotnet build backend/Quarry.sln --no-restore --configuration Release
      - run: dotnet test backend/tests/Quarry.Api.AcceptanceTests/Quarry.Api.AcceptanceTests.csproj --no-restore --configuration Release

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install chromium
        working-directory: frontend/apps/quarry
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test:e2e --workspace=@quarry/app
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
